# Same underlying detector as yolov8_detect.yaml; kept as a separate
# config group entry so `model=yolov8_track` can diverge later (e.g. a
# checkpoint fine-tuned specifically for the box-quality tracking cares
# about most) without disturbing the plain-detection config.
task: detect
weights: yolov8n.pt
image_size: 640
num_classes: ${data.num_classes}
class_names: ${data.class_names}
optimizer:
  _target_: torch.optim.SGD
  lr: 1.0e-2
  momentum: 0.937
  weight_decay: 5.0e-4
scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: 100
  eta_min: 1.0e-5
